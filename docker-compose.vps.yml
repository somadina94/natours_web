# Production stack for EC2 / VPS — used by ./deploy.sh (project: natours-web-vps)
#
# Normal deploy: image from GHCR (built in GitHub Actions). VPS only pulls.
# The `build:` block is for DEPLOY_BUILD_LOCAL=1 fallback only.

name: natours-web-vps

services:
  web:
    image: ${NATOURS_WEB_IMAGE:-ghcr.io/somadina94/natours_web:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-}
    container_name: natours-web
    ports:
      - "4041:4041"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-}
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - natours-web-vps-network

networks:
  natours-web-vps-network:
    driver: bridge
